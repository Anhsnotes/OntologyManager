# Install once:  pip install -e ".[dev]" && pre-commit install --hook-type pre-commit --hook-type pre-push
repos:
  - repo: local
    hooks:
      # On every commit: rewrite staged .ttl files in canonical form.
      # If anything changed, the commit stops; `git add` the files and commit again.
      - id: ontman-normalize
        name: ontman normalize
        entry: ontman normalize
        language: system
        files: \.ttl$
        exclude: ^tests/

      # When the ontology or the example questions change, regenerate docs/ontology.md.
      # If it changed, the commit stops; `git add docs/ontology.md` and commit again.
      - id: ontman-export-md
        name: ontman export-md
        entry: ontman export-md
        language: system
        pass_filenames: false
        files: ^(src/.*\.ttl|tests/competency/.*\.rq|ontman\.toml)$

      # Before pushing: run every quality gate locally so CI rarely surprises you.
      - id: ontman-check
        name: ontman check
        entry: ontman check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
